<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Roadmaps Prototype | Alison Whittaker</title>
  <link rel="icon" type="image/png" href="alison-whittaker-profile.png">
  <style>
    :root {
      --navy: #071c36;
      --navy-2: #0d2947;
      --ink: #1d2a3b;
      --muted: #657184;
      --line: #d6dde6;
      --page: #f3f5f8;
      --panel: #ffffff;
      --blue: #1769e8;
      --green: #2f8b4e;
      --red: #b84a5a;
      --gold: #b17a10;
      --shadow: 0 18px 45px rgba(15, 31, 48, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    a { color: inherit; }

    .prototype-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px max(22px, calc((100vw - 1320px) / 2));
      border-bottom: 1px solid #dfe4eb;
      background: #fff;
    }

    .back-link {
      color: #435168;
      font-size: .84rem;
      font-weight: 800;
      text-decoration: none;
    }

    .page-note {
      color: #728095;
      font-size: .78rem;
      font-weight: 700;
      text-align: right;
    }

    .roadmap-app {
      width: min(calc(100% - 36px), 1320px);
      margin: 26px auto 42px;
      overflow: hidden;
      border: 1px solid #cbd4de;
      border-radius: 8px;
      background: #f8fafc;
      box-shadow: var(--shadow);
    }

    .roadmap-topbar {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) minmax(260px, auto) minmax(270px, 1fr);
      gap: 24px;
      align-items: center;
      padding: 16px 20px;
      background: var(--navy);
      color: #f8fbff;
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .brand strong {
      font-size: 1.02rem;
      letter-spacing: -.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 5px;
      background: var(--blue);
      color: #fff;
      font-size: .72rem;
      font-weight: 850;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .tab {
      min-height: 40px;
      padding: 0 18px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #b8c6d8;
      cursor: pointer;
      font: inherit;
      font-size: .84rem;
      font-weight: 850;
    }

    .tab.is-active {
      border-bottom-color: var(--blue);
      color: #fff;
    }

    .status {
      color: #c8d4e3;
      font-size: .76rem;
      font-weight: 760;
      text-align: right;
    }

    .status span {
      display: block;
      color: #93a6bc;
      font-size: .7rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: auto auto minmax(230px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #eef2f6;
    }

    .segmented {
      display: inline-flex;
      overflow: hidden;
      border: 1px solid #c6d0dc;
      border-radius: 7px;
      background: #dfe6ee;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .segmented button,
    .action-buttons button {
      min-height: 38px;
      padding: 0 14px;
      border: 0;
      background: transparent;
      color: #243348;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 850;
    }

    .segmented button.is-active {
      background: #fff;
      box-shadow: 0 1px 4px rgba(32, 48, 68, .18);
    }

    .quarter-control,
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quarter-control span,
    .search span {
      color: #4c5a6c;
      font-size: .75rem;
      font-weight: 850;
    }

    select,
    input {
      min-height: 40px;
      border: 1px solid #c6d0dc;
      border-radius: 6px;
      background: #fff;
      color: #243348;
      font-size: .86rem;
    }

    select { padding: 0 34px 0 12px; }
    input { width: min(100%, 330px); padding: 0 12px; }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-buttons button {
      border: 1px solid #c6d0dc;
      border-radius: 6px;
      background: #fff;
    }

    .quarter-control[hidden],
    .action-buttons[hidden] {
      display: none !important;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .legend span {
      min-height: 27px;
      padding: 6px 9px;
      border-radius: 5px;
      font-size: .64rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .above { background: #e4f4e8; color: var(--green); }
    .below { background: #f8dfe2; color: var(--red); }
    .watch { background: #f8ecbf; color: var(--gold); }
    .complete { background: var(--green); color: #fff; }

    .view { display: none; }
    .view.is-active { display: block; }

    .roadmap-board,
    .quarterly-plan {
      display: grid;
      gap: 16px;
      padding: 16px;
    }

    .group {
      overflow: hidden;
      border: 1px solid #cbd4de;
      border-radius: 8px;
      background: #fff;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 0 16px;
      border: 0;
      background: var(--navy);
      color: #fff;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .group-header strong {
      font-size: 1.05rem;
      letter-spacing: -.02em;
    }

    .group-header small {
      margin-left: auto;
      color: #b8c6d8;
      font-size: .75rem;
      font-weight: 800;
    }

    .caret { color: #9fb1c6; }
    .group.is-collapsed .caret { transform: rotate(-90deg); }
    .group.is-collapsed .sixq-grid { display: none; }

    .sixq-grid {
      display: grid;
      grid-template-columns: 210px repeat(6, minmax(145px, 1fr));
      overflow-x: auto;
    }

    .lane-heading,
    .quarter-heading {
      min-height: 44px;
      padding: 12px;
      color: #fff;
      font-weight: 900;
    }

    .lane-heading {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--navy-2);
    }

    .quarter-heading:nth-child(2) { background: #5f9d23; }
    .quarter-heading:nth-child(3) { background: #16836e; }
    .quarter-heading:nth-child(4) { background: #1475d6; }
    .quarter-heading:nth-child(5) { background: #145a8b; }
    .quarter-heading:nth-child(6) { background: #663994; }
    .quarter-heading:nth-child(7) { background: #8d1d50; }

    .lane-label {
      position: sticky;
      left: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      min-height: 86px;
      padding: 12px;
      border-top: 1px solid #dce2e9;
      background: #eef1f5;
      color: #4d5a6c;
      font-size: .82rem;
      font-weight: 850;
    }

    .cell {
      min-height: 86px;
      padding: 12px;
      border-top: 1px solid #dce2e9;
      border-left: 1px solid #e2e7ed;
      background: #fbfcfd;
    }

    .cell:nth-child(7n + 2) { background: #f3f8ea; }
    .cell:nth-child(7n + 3) { background: #edf8f5; }
    .cell:nth-child(7n + 4) { background: #edf6ff; }
    .cell:nth-child(7n + 5) { background: #eff6fb; }
    .cell:nth-child(7n + 6) { background: #f5f0fb; }
    .cell:nth-child(7n + 7) { background: #fbf0f5; }

    .cell ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 1.1em;
    }

    .initiative strong {
      display: block;
      color: #223044;
      font-size: .79rem;
      line-height: 1.25;
    }

    .initiative span,
    .empty {
      display: block;
      margin-top: 3px;
      color: #8792a0;
      font-size: .7rem;
    }

    .initiative.status-above::marker { color: var(--green); }
    .initiative.status-below::marker { color: var(--red); }
    .initiative.status-watch::marker { color: var(--gold); }
    .initiative.status-complete::marker { color: var(--green); }

    .quarterly-note {
      margin: 16px 16px 0;
      padding: 12px 14px;
      border: 1px solid #dfc765;
      border-radius: 7px;
      background: #fff8d9;
      color: #67531e;
      font-size: .84rem;
      font-weight: 780;
    }

    .quarterly-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 0 16px;
      background: var(--navy);
      color: #fff;
    }

    .quarterly-group-header strong { font-size: 1.05rem; }
    .quarterly-group-header p { margin: 0; color: #b8c6d8; font-size: .75rem; font-weight: 850; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 14px;
    }

    .initiative-card {
      display: flex;
      min-height: 196px;
      flex-direction: column;
      padding: 16px;
      border: 1px solid #d6dde5;
      border-left: 4px solid var(--green);
      border-radius: 7px;
      background: #fff;
    }

    .initiative-card.status-below { border-left-color: var(--red); }
    .initiative-card.status-watch { border-left-color: var(--gold); }
    .initiative-card.status-complete { border-left-color: var(--green); }

    .capability {
      margin: 0 0 9px;
      color: #4e5a69;
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .initiative-card h3 {
      margin: 0 0 10px;
      color: #17263a;
      font-size: .98rem;
      line-height: 1.28;
    }

    .owners,
    .target {
      color: #526074;
      font-size: .75rem;
      font-weight: 720;
    }

    .owners {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .target { margin: 12px 0 0; }

    .metrics {
      display: flex;
      gap: 22px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #e1e6ec;
    }

    .metrics span {
      display: flex;
      flex-direction: column;
    }

    .metrics small {
      color: #7a8592;
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .metrics strong {
      color: #12633a;
      font-size: 1.02rem;
    }

    .empty-state {
      padding: 24px;
      border: 1px dashed #b6c1cf;
      border-radius: 7px;
      background: #fff;
      color: #5a6878;
      font-weight: 760;
    }

    @media (max-width: 900px) {
      .roadmap-topbar,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .tabs,
      .legend,
      .action-buttons {
        justify-content: flex-start;
      }

      .status { text-align: left; }
      input { width: 100%; }
      .search { align-items: flex-start; flex-direction: column; }
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .prototype-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-note { text-align: left; }
      .roadmap-app { width: min(calc(100% - 22px), 1320px); margin-top: 16px; }
      .segmented, .action-buttons { display: grid; grid-template-columns: 1fr 1fr; }
      .quarter-control { align-items: flex-start; flex-direction: column; }
      select { width: 100%; }
      .sixq-grid { grid-template-columns: 170px repeat(6, 140px); }
      .quarterly-group-header { align-items: flex-start; flex-direction: column; padding-block: 12px; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="prototype-header">
    <a class="back-link" href="index.html#prototypes">← Back to prototypes</a>
    <div class="page-note">Dummy data only · No real company, customer, or financial information</div>
  </header>

  <main class="roadmap-app" data-roadmap-app>
    <header class="roadmap-topbar">
      <div class="brand">
        <strong>Company Roadmaps</strong>
        <span class="badge">DEMO</span>
        <small>v1.0</small>
      </div>
      <div class="tabs" role="tablist" aria-label="Roadmap views">
        <button class="tab is-active" type="button" role="tab" aria-selected="true" data-tab="sixq">6Q Roadmap</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="quarterly">Quarterly Plan</button>
      </div>
      <div class="status">
        Demo data as of Jul 23, 2026
        <span>1 goal · 6 capabilities · 12 dummy initiatives</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Roadmap controls">
      <div class="segmented" aria-label="Grouping">
        <button class="is-active" type="button" data-group="goal">By Goal</button>
        <button type="button" data-group="capability">By Capability</button>
      </div>

      <label class="quarter-control" data-quarter-control hidden>
        <span>Quarter</span>
        <select data-quarter-select>
          <option>Q1 FY'27</option>
          <option>Q2 FY'27</option>
          <option>Q3 FY'27</option>
          <option>Q4 FY'27</option>
          <option>Q1 FY'28</option>
          <option>Q2 FY'28</option>
        </select>
      </label>

      <label class="search">
        <span>Filter initiatives</span>
        <input type="search" placeholder="Filter initiatives..." data-filter>
      </label>

      <div class="action-buttons" data-sixq-actions>
        <button type="button" data-expand-all>Expand all</button>
        <button type="button" data-collapse-all>Collapse all</button>
      </div>

      <div class="legend" aria-label="Initiative status legend">
        <span class="complete">Completed</span>
        <span class="above">Above line</span>
        <span class="below">Below line</span>
        <span class="watch">Needs review</span>
      </div>
    </section>

    <section class="view is-active" data-view="sixq">
      <div class="roadmap-board" data-sixq-board></div>
    </section>

    <section class="view" data-view="quarterly">
      <div class="quarterly-note" data-quarterly-note></div>
      <div class="quarterly-plan" data-quarterly-plan></div>
    </section>
  </main>

  <script>
    const quarters = ["Q1 FY'27", "Q2 FY'27", "Q3 FY'27", "Q4 FY'27", "Q1 FY'28", "Q2 FY'28"];
    const initiatives = [
      { title: 'Initiative 01: Standard onboarding workflow', goal: 'Example Goal [DEMO-001]', capability: 'Customer onboarding', quarter: "Q1 FY'27", product: 'Product Owner A', engineering: 'Engineering Owner A', target: 'Jan 2027', impact: 'Medium', effort: 'M', status: 'above' },
      { title: 'Initiative 02: Guided account setup', goal: 'Example Goal [DEMO-001]', capability: 'Customer onboarding', quarter: "Q1 FY'27", product: 'Product Owner B', engineering: 'Engineering Owner B', target: 'Feb 2027', impact: 'High', effort: 'M', status: 'above' },
      { title: 'Initiative 03: Configurable approval rules', goal: 'Example Goal [DEMO-001]', capability: 'Workflow automation', quarter: "Q2 FY'27", product: 'Product Owner C', engineering: 'Engineering Owner C', target: 'May 2027', impact: 'High', effort: 'L', status: 'watch' },
      { title: 'Initiative 04: Shared task queue', goal: 'Example Goal [DEMO-001]', capability: 'Workflow automation', quarter: "Q2 FY'27", product: 'Product Owner D', engineering: 'Engineering Owner D', target: 'Jun 2027', impact: 'Medium', effort: 'M', status: 'above' },
      { title: 'Initiative 05: Consolidated reporting view', goal: 'Example Goal [DEMO-001]', capability: 'Reporting and insights', quarter: "Q3 FY'27", product: 'Product Owner E', engineering: 'Engineering Owner E', target: 'Aug 2027', impact: 'High', effort: 'L', status: 'above' },
      { title: 'Initiative 06: Role-based dashboard settings', goal: 'Example Goal [DEMO-001]', capability: 'Reporting and insights', quarter: "Q3 FY'27", product: 'Product Owner F', engineering: 'Engineering Owner F', target: 'Sep 2027', impact: 'Medium', effort: 'S', status: 'below' },
      { title: 'Initiative 07: Data import validation', goal: 'Example Goal [DEMO-001]', capability: 'Data quality', quarter: "Q4 FY'27", product: 'Product Owner G', engineering: 'Engineering Owner G', target: 'Nov 2027', impact: 'High', effort: 'M', status: 'above' },
      { title: 'Initiative 08: Exception review queue', goal: 'Example Goal [DEMO-001]', capability: 'Data quality', quarter: "Q4 FY'27", product: 'Product Owner H', engineering: 'Engineering Owner H', target: 'Dec 2027', impact: 'Medium', effort: 'M', status: 'watch' },
      { title: 'Initiative 09: User permission cleanup', goal: 'Example Goal [DEMO-001]', capability: 'Platform controls', quarter: "Q1 FY'28", product: 'Product Owner I', engineering: 'Engineering Owner I', target: 'Feb 2028', impact: 'Medium', effort: 'S', status: 'above' },
      { title: 'Initiative 10: Audit trail export', goal: 'Example Goal [DEMO-001]', capability: 'Platform controls', quarter: "Q1 FY'28", product: 'Product Owner J', engineering: 'Engineering Owner J', target: 'Mar 2028', impact: 'Low', effort: 'S', status: 'complete' },
      { title: 'Initiative 11: Admin notification center', goal: 'Example Goal [DEMO-001]', capability: 'Operational readiness', quarter: "Q2 FY'28", product: 'Product Owner K', engineering: 'Engineering Owner K', target: 'May 2028', impact: 'Medium', effort: 'M', status: 'above' },
      { title: 'Initiative 12: Release readiness checklist', goal: 'Example Goal [DEMO-001]', capability: 'Operational readiness', quarter: "Q2 FY'28", product: 'Product Owner L', engineering: 'Engineering Owner L', target: 'Jun 2028', impact: 'High', effort: 'S', status: 'above' }
    ];

    const state = {
      activeTab: 'sixq',
      groupBy: 'goal',
      filter: '',
      quarter: "Q1 FY'27",
      collapsed: new Set()
    };

    const root = document.querySelector('[data-roadmap-app]');
    const tabButtons = [...root.querySelectorAll('[data-tab]')];
    const viewPanels = [...root.querySelectorAll('[data-view]')];
    const groupButtons = [...root.querySelectorAll('[data-group]')];
    const quarterControl = root.querySelector('[data-quarter-control]');
    const quarterSelect = root.querySelector('[data-quarter-select]');
    const sixqActions = root.querySelector('[data-sixq-actions]');
    const filterInput = root.querySelector('[data-filter]');
    const sixqBoard = root.querySelector('[data-sixq-board]');
    const quarterlyPlan = root.querySelector('[data-quarterly-plan]');
    const quarterlyNote = root.querySelector('[data-quarterly-note]');

    const groupLabel = (item) => state.groupBy === 'goal' ? item.goal : item.capability;

    const filteredInitiatives = () => {
      const query = state.filter.trim().toLowerCase();
      if (!query) return initiatives;
      return initiatives.filter((item) => [
        item.title,
        item.goal,
        item.capability,
        item.product,
        item.engineering,
        item.status,
        item.impact,
        item.effort
      ].join(' ').toLowerCase().includes(query));
    };

    const grouped = (items) => items.reduce((map, item) => {
      const key = groupLabel(item);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(item);
      return map;
    }, new Map());

    const initiativeBullet = (item) => {
      const li = document.createElement('li');
      li.className = `initiative status-${item.status}`;
      li.innerHTML = `<strong>${item.title}</strong><span>${item.capability}</span>`;
      return li;
    };

    const renderSixQ = () => {
      const groups = grouped(filteredInitiatives());
      sixqBoard.innerHTML = '';

      if (!groups.size) {
        sixqBoard.innerHTML = '<div class="empty-state">No dummy initiatives match this filter.</div>';
        return;
      }

      groups.forEach((items, name) => {
        const isCollapsed = state.collapsed.has(name);
        const section = document.createElement('section');
        section.className = `group${isCollapsed ? ' is-collapsed' : ''}`;

        const header = document.createElement('button');
        header.type = 'button';
        header.className = 'group-header';
        header.setAttribute('aria-expanded', String(!isCollapsed));
        header.innerHTML = `
          <span class="caret" aria-hidden="true">▾</span>
          <strong>${name}</strong>
          <small>${new Set(items.map((item) => item.capability)).size} capabilities · ${items.length} dummy initiatives</small>
        `;
        header.addEventListener('click', () => {
          if (state.collapsed.has(name)) state.collapsed.delete(name);
          else state.collapsed.add(name);
          renderSixQ();
        });

        const grid = document.createElement('div');
        grid.className = 'sixq-grid';
        grid.innerHTML = `
          <div class="lane-heading">Capability</div>
          ${quarters.map((quarter) => `<div class="quarter-heading">${quarter}</div>`).join('')}
        `;

        [...new Set(items.map((item) => item.capability))].forEach((capability) => {
          const label = document.createElement('div');
          label.className = 'lane-label';
          label.textContent = capability;
          grid.append(label);

          quarters.forEach((quarter) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const matches = items.filter((item) => item.capability === capability && item.quarter === quarter);
            if (matches.length) {
              const list = document.createElement('ul');
              matches.forEach((item) => list.append(initiativeBullet(item)));
              cell.append(list);
            } else {
              cell.innerHTML = '<span class="empty">No dummy initiatives scheduled</span>';
            }
            grid.append(cell);
          });
        });

        section.append(header, grid);
        sixqBoard.append(section);
      });
    };

    const initiativeCard = (item) => {
      const card = document.createElement('article');
      card.className = `initiative-card status-${item.status}`;
      card.innerHTML = `
        <p class="capability">${item.capability}</p>
        <h3>${item.title}</h3>
        <div class="owners">
          <span>Product: ${item.product}</span>
          <span>Engineering: ${item.engineering}</span>
        </div>
        <p class="target">Target end: ${item.target}</p>
        <div class="metrics">
          <span><small>Impact</small><strong>${item.impact}</strong></span>
          <span><small>Effort</small><strong>${item.effort}</strong></span>
        </div>
      `;
      return card;
    };

    const renderQuarterly = () => {
      const quarterItems = filteredInitiatives().filter((item) => item.quarter === state.quarter);
      const groups = grouped(quarterItems);
      quarterlyPlan.innerHTML = '';
      quarterlyNote.textContent = `Showing dummy initiatives for ${state.quarter}, grouped ${state.groupBy === 'goal' ? 'by goal' : 'by capability'}.`;

      if (!groups.size) {
        quarterlyPlan.innerHTML = '<div class="empty-state">No dummy initiatives match this quarter and filter.</div>';
        return;
      }

      groups.forEach((items, name) => {
        const section = document.createElement('section');
        section.className = 'group';
        section.innerHTML = `
          <header class="quarterly-group-header">
            <strong>${name}</strong>
            <p>${items.length} dummy initiatives</p>
          </header>
        `;

        const grid = document.createElement('div');
        grid.className = 'card-grid';
        items.forEach((item) => grid.append(initiativeCard(item)));
        section.append(grid);
        quarterlyPlan.append(section);
      });
    };

    const render = () => {
      tabButtons.forEach((button) => {
        const isActive = button.dataset.tab === state.activeTab;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-selected', String(isActive));
      });

      viewPanels.forEach((panel) => {
        panel.classList.toggle('is-active', panel.dataset.view === state.activeTab);
      });

      groupButtons.forEach((button) => {
        button.classList.toggle('is-active', button.dataset.group === state.groupBy);
      });

      quarterControl.hidden = state.activeTab !== 'quarterly';
      sixqActions.hidden = state.activeTab !== 'sixq';
      renderSixQ();
      renderQuarterly();
    };

    tabButtons.forEach((button) => {
      button.addEventListener('click', () => {
        state.activeTab = button.dataset.tab;
        render();
      });
    });

    groupButtons.forEach((button) => {
      button.addEventListener('click', () => {
        state.groupBy = button.dataset.group;
        state.collapsed.clear();
        render();
      });
    });

    filterInput.addEventListener('input', (event) => {
      state.filter = event.target.value;
      render();
    });

    quarterSelect.addEventListener('change', (event) => {
      state.quarter = event.target.value;
      render();
    });

    root.querySelector('[data-expand-all]').addEventListener('click', () => {
      state.collapsed.clear();
      renderSixQ();
    });

    root.querySelector('[data-collapse-all]').addEventListener('click', () => {
      grouped(filteredInitiatives()).forEach((_, name) => state.collapsed.add(name));
      renderSixQ();
    });

    render();
  </script>
</body>
</html>
